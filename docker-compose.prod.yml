services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"

  n8n:
    ports: !override
      - "127.0.0.1:5678:5678"

  waha:
    ports: !override
      - "127.0.0.1:3001:3000"

  backend:
    ports: !override
      - "127.0.0.1:4000:4000"
    # Production runs the images that CI already built, tested and pushed to
    # GHCR. Building them again on the host doubled the deploy time (npm ci,
    # tsc, the HuggingFace model download and two Vite builds), which pushed
    # the deploy past the SSH command timeout, and it filled the disk with build
    # cache. `pull_policy: always` makes Compose use the pulled image and ignore
    # the `build:` section inherited from docker-compose.yml.
    #
    # BACKEND_IMAGE / FRONTEND_IMAGE are exported by the deploy job with the
    # commit-pinned `sha-<short-sha>` tag; the defaults are for convenience.
    image: ${BACKEND_IMAGE:-ghcr.io/premtrade/whatsapp-sales-assistant-backend:latest}
    pull_policy: always

  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    image: ${FRONTEND_IMAGE:-ghcr.io/premtrade/whatsapp-sales-assistant-frontend:latest}
    pull_policy: always

  pgadmin:
    ports: !override
      - "127.0.0.1:5050:80"

  # Daily cron job for trial reminders
  cron:
    image: alpine:latest
    container_name: trial-reminders
    command: /bin/sh -c "while true; do sleep 86400; do /opt/cron-job/bin/cron.sh; done"
    volumes:
      - /etc/crontab:/etc/crontab:ro
    restart: unless-stopped
    network_mode: host
    working_dir: /opt/cron-job
    environment:
      - CRON_JOB_PATH=/opt/cron-job/trial-reminders.sh
    depends_on:
      - backend
      - postgres
      - redis
    profiles:
      - trial-reminders

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  waha_data:
  backend_data:
  frontend_data:
  cron_job_data:
