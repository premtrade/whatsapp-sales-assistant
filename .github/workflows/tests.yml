name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_sales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary testcontainers

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package.json

      - name: Install Node dependencies
        working-directory: tests
        run: npm install

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          exit 1

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_sales_test
        run: |
          python -c "
          import os, subprocess, glob
          pg = lambda sql: subprocess.run(['psql', '-h', os.environ['POSTGRES_HOST'], '-p', os.environ['POSTGRES_PORT'], '-U', os.environ['POSTGRES_USER'], '-d', os.environ['POSTGRES_DB'], '-v', 'ON_ERROR_STOP=1', '-c', sql], capture_output=True, text=True)
          pg('CREATE DATABASE whatsapp_sales_test;')
          for f in sorted(glob.glob('database/schema/*.sql') + glob.glob('database/migrations/*.sql')):
              subprocess.run(['psql', '-h', os.environ['POSTGRES_HOST'], '-p', os.environ['POSTGRES_PORT'], '-U', os.environ['POSTGRES_USER'], '-d', os.environ['POSTGRES_DB'], '-v', 'ON_ERROR_STOP=1', '-f', f], capture_output=True, text=True)
          print('Migrations complete')
          "

      - name: Run Python unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_sales_test
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Run Python integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_sales_test
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Run Python e2e tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_sales_test
        run: |
          python -m pytest tests/e2e/ -v --tb=short

      - name: Run Python security tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_sales_test
        run: |
          python -m pytest tests/security/ -v --tb=short

      - name: Run Node.js workflow validation tests
        working-directory: tests
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        if: github.event_name == 'push'
