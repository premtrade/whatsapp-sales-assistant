name: whatsapp-sales-assistant

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    command: >
      postgres
      -c ssl=off
       

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/00_init-multiple-dbs.sql
      - ./database/schema/000_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql
      - ./database/schema/001_functions.sql:/docker-entrypoint-initdb.d/02_functions.sql
      - ./database/schema/002_contacts.sql:/docker-entrypoint-initdb.d/03_contacts.sql
      - ./database/schema/003_conversations.sql:/docker-entrypoint-initdb.d/04_conversations.sql
      - ./database/schema/004_messages.sql:/docker-entrypoint-initdb.d/05_messages.sql
      - ./database/schema/005_products.sql:/docker-entrypoint-initdb.d/06_products.sql
      - ./database/schema/006_quotes.sql:/docker-entrypoint-initdb.d/07_quotes.sql
      - ./database/schema/007_quote_items.sql:/docker-entrypoint-initdb.d/08_quote_items.sql
      - ./database/schema/008_appointments.sql:/docker-entrypoint-initdb.d/09_appointments.sql
      - ./database/schema/009_knowledge_documents.sql:/docker-entrypoint-initdb.d/10_knowledge_documents.sql
      - ./database/schema/010_knowledge_chunks.sql:/docker-entrypoint-initdb.d/11_knowledge_chunks.sql
      - ./database/schema/011_staff_users.sql:/docker-entrypoint-initdb.d/12_staff_users.sql
      - ./database/schema/012_handoffs.sql:/docker-entrypoint-initdb.d/13_handoffs.sql
      - ./database/schema/013_settings.sql:/docker-entrypoint-initdb.d/14_settings.sql
      - ./database/schema/014_audit_logs.sql:/docker-entrypoint-initdb.d/15_audit_logs.sql
      - ./database/schema/015b_fix_foreign_keys.sql:/docker-entrypoint-initdb.d/15b_fix_foreign_keys.sql
      - ./database/schema/016_views.sql:/docker-entrypoint-initdb.d/16_views.sql
      - ./database/schema/017_seed_data.sql:/docker-entrypoint-initdb.d/17_seed_data.sql
      - ./database/schema/018_validation.sql:/docker-entrypoint-initdb.d/99_validation.sql
      - ./database/schema/019_customer_facts.sql:/docker-entrypoint-initdb.d/19_customer_facts.sql
      - ./database/schema/020_conversation_summaries.sql:/docker-entrypoint-initdb.d/20_conversation_summaries.sql
      - ./database/schema/021_memory_embeddings.sql:/docker-entrypoint-initdb.d/21_memory_embeddings.sql
      - ./database/migrations/022_sales_state.sql:/docker-entrypoint-initdb.d/22_sales_state.sql
      - ./database/migrations/023_knowledge_trgm_index.sql:/docker-entrypoint-initdb.d/23_knowledge_trgm_index.sql
      - ./database/migrations/024_seed_knowledge.sql:/docker-entrypoint-initdb.d/24_seed_knowledge.sql
      - ./database/migrations/025_fix_messages_unique_constraint.sql:/docker-entrypoint-initdb.d/25_fix_messages_unique_constraint.sql
      - ./database/migrations/025_align_memory_embeddings.sql:/docker-entrypoint-initdb.d/25b_align_memory_embeddings.sql
      - ./database/migrations/026_align_conversation_summaries.sql:/docker-entrypoint-initdb.d/26_align_conversation_summaries.sql
      - ./database/migrations/027_seed_garco_document.sql:/docker-entrypoint-initdb.d/27_seed_garco_document.sql
      - ./database/migrations/028_audit_logs_immutable.sql:/docker-entrypoint-initdb.d/28_audit_logs_immutable.sql
      - ./database/migrations/029_staff_passwords.sql:/docker-entrypoint-initdb.d/29_staff_passwords.sql
      - ./database/migrations/030_remove_demo_sales_data.sql:/docker-entrypoint-initdb.d/30_remove_demo_sales_data.sql
      - ./database/migrations/031_remove_roof_demo_data.sql:/docker-entrypoint-initdb.d/31_remove_roof_demo_data.sql
      - ./database/migrations/032_pgvector_embeddings.sql:/docker-entrypoint-initdb.d/32_pgvector_embeddings.sql
      - ./database/migrations/033_fix_garco_product_price.sql:/docker-entrypoint-initdb.d/33_fix_garco_product_price.sql
      - ./database/migrations/034_quotes_metadata_column.sql:/docker-entrypoint-initdb.d/34_quotes_metadata_column.sql
      - ./database/migrations/045_multi_tenancy.sql:/docker-entrypoint-initdb.d/45_multi_tenancy.sql
      - ./database/migrations/048_whatsapp_settings.sql:/docker-entrypoint-initdb.d/48_whatsapp_settings.sql

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "${N8N_PORT:-5678}:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SSL: "false"
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_ENV_ACCESS: "false"
      EXECUTIONS_MODE: regular
      GENERIC_TIMEZONE: America/Jamaica
      WAHA_API_KEY: ${WAHA_API_KEY}
      HF_API_KEY: ${HUGGINGFACE_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      N8N_PUBLIC_API_ENABLED: "true"
      N8N_API_KEY_REQUIRED_HEADER_NAME: "X-N8N-API-KEY"

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waha:
    image: devlikeapro/waha:chrome
    container_name: waha
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_SESSION: ${WHATSAPP_SESSION}
      WAHA_WEBHOOK_EVENTS: ${WAHA_WEBHOOK_EVENTS:-}
      WAHA_WEBHOOK_URL: ${WAHA_WEBHOOK_URL:-}

    volumes:
      - waha_data:/app/.sessions

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/sessions >/dev/null 2>&1; code=$$?; test $$code -eq 0 -o $$code -eq 6"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-4000}:4000"

    environment:
      NODE_ENV: ${ENVIRONMENT:-production}
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${BACKEND_JWT_EXPIRES_IN:-1d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    volumes:
      - backend_data:/app/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    environment:
      NODE_ENV: ${ENVIRONMENT:-production}
      VITE_API_URL: ${BACKEND_PUBLIC_URL:-http://localhost:4000}
      VITE_N8N_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}

    volumes:
      - frontend_data:/app/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_DESKTOP_USER: "'${PGADMIN_EMAIL}'"
      PGADMIN_SETUP_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_SETUP_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://[::1]:80/ >/dev/null 2>&1; code=$$?; test $$code -eq 0 -o $$code -eq 1 -o $$code -eq 8"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  pgadmin_data:
  waha_data:
  backend_data:
  frontend_data: